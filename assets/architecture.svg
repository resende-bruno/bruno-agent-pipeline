<svg viewBox="0 0 1240 660" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#f2ecff"/>
    </marker>
    <marker id="arrHot" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#ffb13d"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1240" height="660" fill="#2b1b4d"/>

  <!-- title -->
  <text x="620" y="40" text-anchor="middle" fill="#f2ecff" font-size="25" font-weight="800" letter-spacing="1">REMOTE AGENT DISPATCH PIPELINE</text>
  <rect x="440" y="50" width="360" height="5" fill="#ffb13d"/>
  <text x="620" y="74" text-anchor="middle" fill="#c9b8ec" font-size="13" font-weight="600">a message from your phone becomes reviewed code changes on your own dev machine</text>

  <!-- ============ ZONE: You ============ -->
  <rect x="38" y="108" width="190" height="470" fill="#120b20"/>
  <rect x="30" y="100" width="190" height="470" fill="#352460" stroke="#120b20" stroke-width="3"/>
  <rect x="46" y="86" width="60" height="26" fill="#f2ecff" stroke="#120b20" stroke-width="3"/>
  <text x="76" y="104" text-anchor="middle" fill="#120b20" font-size="12" font-weight="800" letter-spacing="1">YOU</text>

  <g>
    <rect x="56" y="156" width="150" height="90" fill="#120b20"/>
    <rect x="50" y="150" width="150" height="90" fill="#f2ecff" stroke="#120b20" stroke-width="3"/>
    <text x="125" y="186" text-anchor="middle" fill="#120b20" font-size="14" font-weight="800">MESSENGER</text>
    <text x="125" y="207" text-anchor="middle" fill="#120b20" font-size="10.5" font-weight="600">Telegram / Discord /</text>
    <text x="125" y="222" text-anchor="middle" fill="#120b20" font-size="10.5" font-weight="600">Slack / WhatsApp ...</text>
  </g>

  <g>
    <rect x="56" y="436" width="150" height="110" fill="#120b20"/>
    <rect x="50" y="430" width="150" height="110" fill="#f9a8d4" stroke="#120b20" stroke-width="3"/>
    <text x="125" y="460" text-anchor="middle" fill="#120b20" font-size="13" font-weight="800">HUMAN REVIEW</text>
    <text x="125" y="481" text-anchor="middle" fill="#120b20" font-size="10.5" font-weight="600">every diff read,</text>
    <text x="125" y="496" text-anchor="middle" fill="#120b20" font-size="10.5" font-weight="600">every commit, merge</text>
    <text x="125" y="511" text-anchor="middle" fill="#120b20" font-size="10.5" font-weight="600">and DB change made</text>
    <text x="125" y="526" text-anchor="middle" fill="#120b20" font-size="10.5" font-weight="600">by hand</text>
  </g>

  <!-- ============ ZONE: VPS ============ -->
  <rect x="288" y="108" width="300" height="470" fill="#120b20"/>
  <rect x="280" y="100" width="300" height="470" fill="#352460" stroke="#120b20" stroke-width="3"/>
  <rect x="296" y="86" width="196" height="26" fill="#f2ecff" stroke="#120b20" stroke-width="3"/>
  <text x="394" y="104" text-anchor="middle" fill="#120b20" font-size="12" font-weight="800" letter-spacing="1">SMALL VPS · ALWAYS ON</text>

  <g>
    <rect x="306" y="156" width="260" height="150" fill="#120b20"/>
    <rect x="300" y="150" width="260" height="150" fill="#7ee2a0" stroke="#120b20" stroke-width="3"/>
    <text x="430" y="180" text-anchor="middle" fill="#120b20" font-size="15" font-weight="800">GATEWAY AGENT</text>
    <text x="430" y="202" text-anchor="middle" fill="#120b20" font-size="10.5" font-weight="600">understands the request, improves the</text>
    <text x="430" y="217" text-anchor="middle" fill="#120b20" font-size="10.5" font-weight="600">prompt, asks clarifying questions,</text>
    <text x="430" y="232" text-anchor="middle" fill="#120b20" font-size="10.5" font-weight="600">confirms before dispatching</text>
    <rect x="316" y="246" width="228" height="40" fill="#120b20"/>
    <text x="430" y="263" text-anchor="middle" fill="#7ee2a0" font-size="10" font-weight="700">NO SHELL FREEDOM: A STRICT ALLOWLIST</text>
    <text x="430" y="277" text-anchor="middle" fill="#7ee2a0" font-size="10" font-weight="700">PERMITS ONLY THE DISPATCH SSH CALL</text>
  </g>

  <g>
    <rect x="306" y="336" width="260" height="100" fill="#120b20"/>
    <rect x="300" y="330" width="260" height="100" fill="#c9b8ec" stroke="#120b20" stroke-width="3"/>
    <text x="430" y="358" text-anchor="middle" fill="#120b20" font-size="13" font-weight="800">SCHEDULER / AUTOMATIONS</text>
    <text x="430" y="380" text-anchor="middle" fill="#120b20" font-size="10.5" font-weight="600">per-ticket finalize watcher</text>
    <text x="430" y="395" text-anchor="middle" fill="#120b20" font-size="10.5" font-weight="600">+ standing sweep watchdog (every 3 min)</text>
    <text x="430" y="410" text-anchor="middle" fill="#120b20" font-size="10.5" font-weight="600">redundant result delivery</text>
  </g>

  <!-- ============ ZONE: Dev machine ============ -->
  <rect x="648" y="108" width="570" height="470" fill="#120b20"/>
  <rect x="640" y="100" width="570" height="470" fill="#352460" stroke="#120b20" stroke-width="3"/>
  <rect x="656" y="86" width="170" height="26" fill="#f2ecff" stroke="#120b20" stroke-width="3"/>
  <text x="741" y="104" text-anchor="middle" fill="#120b20" font-size="12" font-weight="800" letter-spacing="1">YOUR DEV MACHINE</text>

  <g>
    <rect x="666" y="156" width="240" height="130" fill="#120b20"/>
    <rect x="660" y="150" width="240" height="130" fill="#f2ecff" stroke="#120b20" stroke-width="3"/>
    <text x="780" y="180" text-anchor="middle" fill="#120b20" font-size="14" font-weight="800">SSHD · FORCED COMMAND</text>
    <text x="780" y="202" text-anchor="middle" fill="#120b20" font-size="10.5" font-weight="600">dedicated key can run ONE script,</text>
    <text x="780" y="217" text-anchor="middle" fill="#120b20" font-size="10.5" font-weight="600">nothing else</text>
    <rect x="690" y="230" width="180" height="36" fill="#120b20"/>
    <text x="780" y="246" text-anchor="middle" fill="#f2ecff" font-size="11" font-weight="700" font-family="Consolas, monospace">START · WAIT</text>
    <text x="780" y="260" text-anchor="middle" fill="#f2ecff" font-size="11" font-weight="700" font-family="Consolas, monospace">STATUS · SWEEP</text>
  </g>

  <g>
    <rect x="666" y="316" width="240" height="120" fill="#120b20"/>
    <rect x="660" y="310" width="240" height="120" fill="#c9b8ec" stroke="#120b20" stroke-width="3"/>
    <text x="780" y="338" text-anchor="middle" fill="#120b20" font-size="13" font-weight="800">DISPATCH SCRIPT</text>
    <text x="780" y="360" text-anchor="middle" fill="#120b20" font-size="10.5" font-weight="600">finds the project, makes a git</text>
    <text x="780" y="375" text-anchor="middle" fill="#120b20" font-size="10.5" font-weight="600">worktree per branch, picks the model</text>
    <text x="780" y="390" text-anchor="middle" fill="#120b20" font-size="10.5" font-weight="600">tier, launches the container,</text>
    <text x="780" y="405" text-anchor="middle" fill="#120b20" font-size="10.5" font-weight="600">finalizes + reports when it exits</text>
  </g>

  <g>
    <rect x="956" y="156" width="240" height="190" fill="#120b20"/>
    <rect x="950" y="150" width="240" height="190" fill="#ffb13d" stroke="#120b20" stroke-width="3"/>
    <text x="1070" y="180" text-anchor="middle" fill="#120b20" font-size="14" font-weight="800">WORK CONTAINER</text>
    <text x="1070" y="202" text-anchor="middle" fill="#120b20" font-size="10.5" font-weight="600">coding agent CLI, headless,</text>
    <text x="1070" y="217" text-anchor="middle" fill="#120b20" font-size="10.5" font-weight="600">one per ticket, ephemeral (Docker)</text>
    <text x="1070" y="238" text-anchor="middle" fill="#120b20" font-size="10.5" font-weight="600">sees: the worktree, the task file,</text>
    <text x="1070" y="253" text-anchor="middle" fill="#120b20" font-size="10.5" font-weight="600">mounted memory, a session dir</text>
    <rect x="966" y="268" width="208" height="58" fill="#120b20"/>
    <text x="1070" y="286" text-anchor="middle" fill="#ffb13d" font-size="10" font-weight="700">DENY-LIST: CANNOT COMMIT OR PUSH</text>
    <text x="1070" y="301" text-anchor="middle" fill="#ffb13d" font-size="10" font-weight="700">THE PROJECT REPO · NO SUDO</text>
    <text x="1070" y="316" text-anchor="middle" fill="#ffb13d" font-size="10" font-weight="700">NO DESTRUCTIVE DELETES</text>
  </g>

  <g>
    <rect x="956" y="386" width="240" height="110" fill="#120b20"/>
    <rect x="950" y="380" width="240" height="110" fill="#c9b8ec" stroke="#120b20" stroke-width="3"/>
    <text x="1070" y="408" text-anchor="middle" fill="#120b20" font-size="13" font-weight="800">MEMORY REPO (GIT)</text>
    <text x="1070" y="430" text-anchor="middle" fill="#120b20" font-size="10.5" font-weight="600">per-project notes, glossary,</text>
    <text x="1070" y="445" text-anchor="middle" fill="#120b20" font-size="10.5" font-weight="600">conventions and skills. The only</text>
    <text x="1070" y="460" text-anchor="middle" fill="#120b20" font-size="10.5" font-weight="600">repo the agent may commit to</text>
  </g>

  <g>
    <rect x="666" y="466" width="240" height="80" fill="#120b20"/>
    <rect x="660" y="460" width="240" height="80" fill="#f2ecff" stroke="#120b20" stroke-width="3"/>
    <text x="780" y="488" text-anchor="middle" fill="#120b20" font-size="13" font-weight="800">PROJECT CHECKOUTS</text>
    <text x="780" y="510" text-anchor="middle" fill="#120b20" font-size="10.5" font-weight="600">your real repos: changes land as</text>
    <text x="780" y="525" text-anchor="middle" fill="#120b20" font-size="10.5" font-weight="600">uncommitted diffs for your review</text>
  </g>

  <!-- ============ ARROWS ============ -->
  <!-- messenger -> gateway -->
  <line x1="200" y1="195" x2="294" y2="200" stroke="#f2ecff" stroke-width="3" marker-end="url(#arr)"/>
  <text x="250" y="182" text-anchor="middle" fill="#f2ecff" font-size="11" font-weight="700">"Work: ..."</text>

  <!-- gateway -> sshd (hot path) -->
  <line x1="560" y1="215" x2="654" y2="215" stroke="#ffb13d" stroke-width="4" marker-end="url(#arrHot)"/>
  <text x="610" y="200" text-anchor="middle" fill="#ffb13d" font-size="11" font-weight="800">SSH, PRIVATE</text>
  <text x="610" y="237" text-anchor="middle" fill="#ffb13d" font-size="10" font-weight="700">OVERLAY NETWORK</text>

  <!-- sshd -> dispatch -->
  <line x1="780" y1="280" x2="780" y2="304" stroke="#f2ecff" stroke-width="3" marker-end="url(#arr)"/>

  <!-- dispatch -> container -->
  <line x1="900" y1="345" x2="944" y2="294" stroke="#f2ecff" stroke-width="3" marker-end="url(#arr)"/>
  <text x="890" y="306" text-anchor="middle" fill="#f2ecff" font-size="11" font-weight="700">docker run</text>

  <!-- dispatch -> worktree -->
  <line x1="780" y1="430" x2="780" y2="454" stroke="#f2ecff" stroke-width="3" marker-end="url(#arr)"/>
  <text x="844" y="449" text-anchor="middle" fill="#f2ecff" font-size="11" font-weight="700">git worktree</text>

  <!-- container <-> memory -->
  <line x1="1070" y1="346" x2="1070" y2="374" stroke="#f2ecff" stroke-width="3" marker-end="url(#arr)" marker-start="url(#arr)"/>

  <!-- container -> worktree (edits) -->
  <line x1="950" y1="320" x2="906" y2="464" stroke="#f2ecff" stroke-width="3" marker-end="url(#arr)"/>
  <text x="958" y="404" text-anchor="middle" fill="#f2ecff" font-size="11" font-weight="700">edits files</text>

  <!-- scheduler -> sshd (wait/sweep) -->
  <line x1="560" y1="380" x2="654" y2="262" stroke="#f2ecff" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arr)"/>
  <text x="588" y="318" text-anchor="middle" fill="#c9b8ec" font-size="10" font-weight="700">WAIT / SWEEP</text>

  <!-- gateway -> messenger (results) -->
  <line x1="300" y1="250" x2="206" y2="214" stroke="#f2ecff" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arr)"/>
  <text x="246" y="252" text-anchor="middle" fill="#c9b8ec" font-size="10" font-weight="700">raw results</text>

  <!-- worktree -> human review -->
  <line x1="660" y1="505" x2="206" y2="490" stroke="#f2ecff" stroke-width="3" marker-end="url(#arr)"/>
  <text x="430" y="483" text-anchor="middle" fill="#f2ecff" font-size="11" font-weight="700">uncommitted diff, reviewed line by line</text>

  <!-- legend -->
  <rect x="38" y="608" width="1180" height="42" fill="#120b20"/>
  <rect x="30" y="600" width="1180" height="42" fill="#352460" stroke="#120b20" stroke-width="3"/>
  <line x1="60" y1="621" x2="100" y2="621" stroke="#ffb13d" stroke-width="4"/>
  <text x="110" y="625" fill="#f2ecff" font-size="11" font-weight="600">the only remote command path (forced command + allowlist on both ends)</text>
  <line x1="536" y1="621" x2="576" y2="621" stroke="#f2ecff" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="586" y="625" fill="#f2ecff" font-size="11" font-weight="600">result delivery (redundant: per-ticket watcher + standing watchdog)</text>
  <rect x="996" y="614" width="14" height="14" fill="#120b20" stroke="#ffb13d" stroke-width="1.5"/>
  <text x="1018" y="625" fill="#c9b8ec" font-size="11" font-weight="600">ink panels = hard restrictions</text>
</svg>
